[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "cosmos-synthia"
dynamic = ["version"]
description = "Agent Skill and MCP tools for the Synthesizer Python package"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Project keywords, following Synthesizer's list where they apply
keywords = [
    "galaxy",
    "modelling",
    "galaxy formation",
    "galaxy evolution",
    "parametric",
    "theory",
    "cosmology",
    "SED",
    "sed",
    "synthetic observations",
    "agent",
    "agent skill",
    "MCP",
    "LLM",
]
authors = [
    {name = "W. J. Roper", email = "w.roper@sussex.ac.uk"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "mcp>=2",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff==0.15.15",
]
test = [
    "pytest>=8",
    "ruff==0.15.15",
]

[project.urls]
Homepage = "https://github.com/synthesizer-project/synthia"
Repository = "https://github.com/synthesizer-project/synthia"
Issues = "https://github.com/synthesizer-project/synthia/issues"

[project.scripts]
synthia-mcp = "synthia.server:main"
synthia-install = "synthia.install:main"

# The version comes from the git tag, so a release needs no source edit
# and the tag can never disagree with the published metadata.
[tool.hatch.version]
source = "vcs"

# Make a version file at build time, mirroring Synthesizer's
# setuptools_scm version_file. Not tracked in version control.
[tool.hatch.build.hooks.vcs]
version-file = "src/synthia/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/synthia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/synthia/skill/examples/**/*.py" = ["D"]
